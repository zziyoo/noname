name: AI PR Review

# Security model:
# - pull_request_target is used so secrets are available for fork PRs.
# - We NEVER checkout or execute code from the PR head.
# - We fetch only PR metadata/diff through GitHub's API.
# - The reviewer code itself comes from the trusted base branch.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      repo:
        description: "Repository to review (owner/repo), e.g. libnoname/noname"
        required: true
        default: "libnoname/noname"
      pr_number:
        description: "PR number to review"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-pr-review-${{ github.event.pull_request.number || 'manual' }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout trusted base revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install OpenAI SDK
        working-directory: .github/ai-review
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund openai@^5

      - name: Collect PR context
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
          TARGET_REPO: ${{ inputs.repo || github.repository }}
        run: |
          mkdir -p .ai-review

          gh pr view "$PR_NUMBER" \
            --repo "$TARGET_REPO" \
            --json title,body,author,baseRefName,headRefName,commits,labels \
            > .ai-review/pr.json

          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/$TARGET_REPO/pulls/$PR_NUMBER/files?per_page=100" \
            > .ai-review/files.json

          gh api \
            -H "Accept: application/vnd.github.diff" \
            "/repos/$TARGET_REPO/pulls/$PR_NUMBER" \
            > .ai-review/pr.diff

          find . -type f \
            -not -path './.git/*' \
            -not -path './node_modules/*' \
            -not -path './.ai-review/*' \
            | sort \
            | head -n 500 \
            > .ai-review/repo-files.txt

      - name: Run AI review
        env:
          OPENAI_API_KEY: ${{ secrets[vars.OPENAI_SECRET_NAME || 'OPENAI_API_KEY'] }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.5' }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL || '' }}
        run: node .github/ai-review/review.mjs

      - name: Publish PR review
        if: github.event_name == 'pull_request_target'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node .github/ai-review/publish.mjs

      - name: Show review result (manual)
        if: github.event_name == 'workflow_dispatch'
        run: cat .ai-review/review.json

      - name: Upload review result (manual)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ai-review-result
          path: .ai-review/review.json
